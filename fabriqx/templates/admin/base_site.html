{% extends "admin/base_site.html" %}
{% load static %}
{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'fabriqx/admin/css/custom_admin.css' %}">
    <script src="{% static 'fabriqx/js/admin-ui.js' %}" defer></script>
    <script src="{% static 'fabriqx/js/delete-dialog.js' %}" defer></script>
    <style>
        .fabriqx-delete-dialog { border: 0; border-radius: 12px; padding: 24px; width: min(420px, calc(100% - 32px)); margin: auto; color: inherit; background: var(--color-base-50, white); }
        .dark .fabriqx-delete-dialog { background: var(--color-base-900, #18181b); }
        .fabriqx-delete-dialog::backdrop { background: rgb(0 0 0 / 45%); }
        .fabriqx-delete-dialog h2 { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
        .fabriqx-delete-dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .fabriqx-delete-dialog button { padding: 8px 20px; border-radius: 6px; border: 1px solid #a1a1aa; cursor: pointer; }
        .fabriqx-delete-dialog button[type=submit] { background: #dc2626; border-color: #dc2626; color: white; }
    </style>
{% endblock %}
