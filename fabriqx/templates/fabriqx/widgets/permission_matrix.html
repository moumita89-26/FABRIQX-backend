<div class="permission-matrix" data-permission-matrix>
    {% for group in widget.matrix_groups %}
        <section class="border border-base-200 mb-4 overflow-hidden rounded-default dark:border-base-700">
            <header class="bg-base-50 flex items-center justify-between px-4 py-3 dark:bg-base-800">
                <strong>{{ group.name }}</strong>
                <label class="flex gap-2 items-center"><input type="checkbox" data-select-group aria-label="Select all {{ group.name }} permissions"> Select all</label>
            </header>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead><tr><th scope="col">Feature</th><th scope="col">View</th><th scope="col">Add</th><th scope="col">Edit</th><th scope="col">Delete</th></tr></thead>
                    <tbody>
                        {% for row in group.models %}
                            <tr><th scope="row">{{ row.model }}</th>
                                {% for cell in row.cells %}
                                    <td>{% if cell.permission %}
                                        <input type="checkbox" name="{{ widget.name }}" value="{{ cell.permission.id }}" data-access-permission {% if cell.permission.checked %}checked{% endif %} aria-label="{{ cell.label }} {{ row.model }}" title="{{ cell.label }} {{ row.model }}">
                                    {% else %}<span title="Not available for this feature">—</span>{% endif %}</td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    {% endfor %}
</div>
<script>
(() => {
    document.querySelectorAll('[data-permission-matrix] section').forEach(section => {
        const all = section.querySelector('[data-select-group]');
        const permissions = Array.from(section.querySelectorAll('[data-access-permission]'));
        const sync = () => {all.checked = permissions.length > 0 && permissions.every(input => input.checked); all.indeterminate = !all.checked && permissions.some(input => input.checked);};
        all.addEventListener('change', () => { permissions.forEach(input => input.checked = all.checked); sync(); });
        permissions.forEach(input => input.addEventListener('change', sync));
        sync();
    });
})();
</script>
